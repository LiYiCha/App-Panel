name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Restore Keystore from Secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p panel-app/key
            echo "$KEYSTORE_B64" | base64 -d > panel-app/key/ycKey.jks
            echo "Keystore restored successfully."
          else
            echo "Warning: RELEASE_KEYSTORE_BASE64 secret not found, falling back to debug signing."
          fi

      - name: Grant execute permission for gradlew
        run: |
          sed -i 's/\r$//' panel-app/gradlew
          chmod +x panel-app/gradlew

      - name: Build Release APK
        working-directory: panel-app
        env:
          RELEASE_STORE_FILE: ../key/ycKey.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: panel-app/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
