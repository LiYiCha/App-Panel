name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Compile Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: |
          sed -i 's/\r$//' panel-app/gradlew
          chmod +x panel-app/gradlew

      - name: Run Build Check
        working-directory: panel-app
        # --info：失败时能看到每个仓库的真实报错（超时 / 403 / 404），便于定位
        run: ./gradlew assembleDebug --no-daemon --info
